paths:
  /attendance:
    post:
      consumes:
      - application/json
      description: Mark attendance for an enrollment. Admin access is required.
      parameters:
      - description: Attendance details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Ayushmangit_adaago_git_backend_internal_service.CreateAttendanceInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/cmd_api.AttendanceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Mark attendance
      tags:
      - attendance
  /attendance/{attendanceID}:
    get:
      description: Get a single attendance record by ID. Admin access is required.
      parameters:
      - description: Attendance ID
        in: path
        name: attendanceID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api.AttendanceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Get attendance
      tags:
      - attendance
    patch:
      consumes:
      - application/json
      description: Update the status or remarks of an attendance record. Admin access
        is required.
      parameters:
      - description: Attendance ID
        in: path
        name: attendanceID
        required: true
        type: integer
      - description: Attendance update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Ayushmangit_adaago_git_backend_internal_service.UpdateAttendanceInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api.AttendanceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: Update attendance
      tags:
      - attendance
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login and return an access token and profile status
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cmd_api.LoginUserPayload'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/cmd_api.LoginResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
      summary: Login user
      tags:
      - auth
  /batches:
    get:
      description: Returns all batches
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/cmd_api.BatchesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List batches
      tags:
      - batches
    post:
      consumes:
      - application/json
      description: Create a batch under an active program. Admin access is required.
      parameters:
      - description: Batch details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_Ayushmangit_adaago_git_backend_internal_service.CreateBatchInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/cmd_api.BatchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "404":
