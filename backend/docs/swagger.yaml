paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login and return an access token and profile status
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cmd_api.LoginUserPayload'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/cmd_api.LoginResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
      summary: Login user
      tags:
      - auth
  /batches:
    get:
      description: Returns all batches
      produces:
      - application/json
