          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/cmd_api.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: List batches
      tags:
      - batches
    post:
      consumes:
      - application/json
      description: Create a batch under an active program. Admin access is required.
      parameters:
      - description: Batch details
