root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd/api"
  entrypoint = ["./tmp/main"]

  delay = 1000

  post_cmd = ["swag fmt","swag init -g cmd/api/main.go --parseDependency --parseInternal "]
  include_ext = ["go", "tpl", "tmpl", "html", "env", "toml"]
  exclude_dir = [
    "tmp",
    "vendor",
    ".git",
    "testdata"
  ]

  exclude_file = []
  exclude_regex = []
  exclude_unchanged = false
  follow_symlink = false
  include_dir = []

  stop_on_error = true
  send_interrupt = true
  kill_delay = 500

  log = "tmp/air.log"

[log]
  time = true

[misc]
  clean_on_exit = true
